name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ⛔ A WORKFLOW THAT FAILS TO PARSE REPORTS NOTHING AT ALL -- no red cross, no
  # jobs, and `gh pr checks` answers "no checks reported on the branch", which
  # reads exactly like a check that has not started yet. actionlint is the only
  # thing that catches it, so it is the first lane. (Same reasoning, and the
  # same incident, as go-fleettools/fleettools.)
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  test:
    name: build + vet + test
    strategy:
      fail-fast: false
      matrix:
        # The command builds paths and file:// URLs and walks up to the root
        # looking for a .git; macOS is where kit.py was run and where /var is
        # a symlink to /private/var.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # ⛔ SAY WHICH TOOLCHAIN RAN. A green check that does not record the
      # compiler behind it makes every figure measured under it unattributable.
      - run: go version
      - name: gofmt
        run: |
          drift=$(gofmt -l .)
          if [ -n "$drift" ]; then echo "::error::not gofmt-clean:"; echo "$drift"; exit 1; fi
      - name: build
        run: CGO_ENABLED=0 go build ./...
      - name: vet
        run: go vet ./...
      - name: test, 100% statement coverage
        run: |
          go test -race -timeout 5m -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out
          below=$(go tool cover -func=coverage.out | awk '$NF != "100.0%"')
          if [ -n "$below" ]; then echo "::error::coverage below 100% on:"; echo "$below"; exit 1; fi

      # ⛔ EIGHT ADVISORIES WERE REACHABLE FROM THIS MODULE and nothing asked.
      # Scanned by hand on 2026-10-18 against the go.mod of that morning
      # (`go 1.27.1`): GO-2026-6605 through stdlib.Get, 6613 through Read, 6611
      # and 6607 through Write, 6603 through Close, 6610 and 6617 through
      # AddConn, 6608 through ReadMIMEHeader -- reachable, not merely present.
      # This module fetches pages, so those are its own HTTP paths.
      #
      # ⛔ And the directive IS this lane's toolchain, because the setup step
      # reads `go-version-file: go.mod`. A floor below the fix was a lane
      # linking the vulnerable standard library, so 100% coverage was being
      # measured on it.
      #
      # ⛔ NO `set -o pipefail`, deliberately: govulncheck exits non-zero over
      # findings it has decided are not called, and zero over some it has,
      # which is the whole reason vulngate exists. An unread scan is caught by
      # the emptiness check and by vulngate, which believes a run only when it
      # carried a config AND an SBOM. -go holds the scan to the toolchain that
      # actually ran.
      - name: govulncheck, judged by vulngate
        run: |
          set -eu
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/go-fleettools/fleettools/cmd/vulngate@v0.20.1
          BIN="$(go env GOPATH)/bin"
          "$BIN/govulncheck" -format json ./... > /tmp/vuln.json || true
          test -s /tmp/vuln.json || { echo "::error::govulncheck wrote nothing at all"; exit 1; }
          "$BIN/vulngate" -go "$(go env GOVERSION)" /tmp/vuln.json

  # A real Hugo site importing the module from THIS checkout (example/go.mod
  # replaces it with ../), checked for what the partials must put in the page,
  # then judged by `landingkit verify` with real hugo and real Chrome:
  # against itself it must pass, and against a copy whose background is tinted
  # (go-fft's old defect) it must FAIL. An instrument that has only ever said
  # PASS has not shown that it can see anything.
  hugo:
    name: a site importing the module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Hugo resolves modules with the go command.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.168.0"
          extended: true
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - run: go version && hugo version && "${{ steps.chrome.outputs.chrome-path }}" --version
      - name: build the example
        working-directory: example
        run: hugo --destination "$RUNNER_TEMP/example"
      - name: the partials are in the page
        run: |
          page="$RUNNER_TEMP/example/index.html"
          for want in '<meta name="darkreader-lock">' 'class="fork-ribbon"' '--cyan:#0079A8' 'id="theme-toggle"' 'aria-label="Fork me on GitHub"'; do
            grep -qF -- "$want" "$page" || { echo "::error::$want is not in the built page"; exit 1; }
          done
          echo "every partial reached the page"
          page="$RUNNER_TEMP/example/carousel/index.html"
          for want in 'aria-roledescription="carousel"' 'window.landingkitCarousel=api' 'src="/carousel/2.svg"' 'data-fade="loading"' 'id="lk-carousel-start"'; do
            grep -qF -- "$want" "$page" || { echo "::error::$want is not in the carousel page"; exit 1; }
          done
          echo "the loading carousel reached its page"
      - name: go mod tidy keeps the requirement
        working-directory: example
        run: |
          go mod tidy
          grep -q 'github.com/go-fleettools/landingkit' go.mod \
            || { echo "::error::tidy deleted the requirement: kit.go no longer anchors it"; exit 1; }
      # ⛔ Ubuntu 24.04 forbids unprivileged user namespaces through AppArmor,
      # and Chrome then aborts with "No usable sandbox!" (signal 6) before it
      # renders anything. The runner is lifted to allow them, rather than the
      # tool learning --no-sandbox: what verify runs on a laptop is what it
      # runs here.
      - name: let Chrome use its sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: go build -o "$RUNNER_TEMP/landingkit" ./cmd/landingkit
      # Live, on purpose: the example links to a github.com blob page, which
      # github.com answers with 503 when a program asks for it; `links` must
      # go through the raw host and pass.
      - name: every link of the example resolves
        run: |
          "$RUNNER_TEMP/landingkit" links "$RUNNER_TEMP/example" | tee "$RUNNER_TEMP/links.log"
          grep -q '(via https://raw.githubusercontent.com/go-fleettools/landingkit/' "$RUNNER_TEMP/links.log" \
            || { echo "::error::the blob link was not probed on the raw host"; exit 1; }
      - name: verify against itself (must pass)
        run: |
          "$RUNNER_TEMP/landingkit" verify -chrome "${{ steps.chrome.outputs.chrome-path }}" \
            -out "$RUNNER_TEMP/self" example example | tee "$RUNNER_TEMP/self.log"
      # The false FAIL v0.2.0 gave: a tall full-width band (go-embedded-ruby's
      # .strip, on --bg-soft) at the height where fixed points used to sample.
      # The site has it, the reference does not, the backgrounds are equal:
      # verify must PASS, and must have sampled fewer points than on a page
      # without the band, which shows the probe excluded it.
      - name: verify a copy with a tall band where the old points sampled (must pass)
        run: |
          cp -R example "$RUNNER_TEMP/banded"
          sed -i "s#=> ../#=> $GITHUB_WORKSPACE#" "$RUNNER_TEMP/banded/go.mod"
          sed -i 's#  <section style="height:2400px"></section>#  <section style="height:300px"></section>\n  <div class="strip" style="height:900px"><div class="wrap"><p class="lead-line">a tall full-width band</p></div></div>\n  <section style="height:1600px"></section>#' "$RUNNER_TEMP/banded/layouts/index.html"
          grep -q 'class="strip" style="height:900px"' "$RUNNER_TEMP/banded/layouts/index.html" \
            || { echo "::error::the band was not inserted"; exit 1; }
          "$RUNNER_TEMP/landingkit" verify -chrome "${{ steps.chrome.outputs.chrome-path }}" \
            -out "$RUNNER_TEMP/banded-out" "$RUNNER_TEMP/banded" example | tee "$RUNNER_TEMP/banded.log"
          self=$(sed -n 's/^PASS light: \([0-9]*\)\/.*/\1/p' "$RUNNER_TEMP/self.log")
          band=$(sed -n 's/^PASS light: \([0-9]*\)\/.*/\1/p' "$RUNNER_TEMP/banded.log")
          echo "background points: $self without the band, $band with it"
          if [ -z "$self" ] || [ -z "$band" ] || [ "$band" -ge "$self" ]; then
            echo "::error::the band did not reduce the sampled points ($band vs $self)"; exit 1
          fi
      - name: verify a tinted copy (must fail)
        run: |
          cp -R example "$RUNNER_TEMP/tinted"
          mkdir -p "$RUNNER_TEMP/tinted/layouts/partials"
          sed 's/--bg:#ffffff;/--bg:#f0fdf9;/' layouts/partials/styles.html > "$RUNNER_TEMP/tinted/layouts/partials/styles.html"
          sed -i "s#=> ../#=> $GITHUB_WORKSPACE#" "$RUNNER_TEMP/tinted/go.mod"
          set +e
          "$RUNNER_TEMP/landingkit" verify -chrome "${{ steps.chrome.outputs.chrome-path }}" \
            -out "$RUNNER_TEMP/tinted-out" "$RUNNER_TEMP/tinted" example | tee "$RUNNER_TEMP/tinted.log"
          code=${PIPESTATUS[0]}
          set -e
          [ "$code" = 1 ] || { echo "::error::verify exited $code on a tinted background"; exit 1; }
          grep -q '^FAIL light: \([0-9]*\)/\1 background pixels differ' "$RUNNER_TEMP/tinted.log" \
            || { echo "::error::the pixel check did not see the tint"; exit 1; }
          grep -q 'FAIL the <style> blocks differ' "$RUNNER_TEMP/tinted.log" \
            || { echo "::error::the text check did not see the tint"; exit 1; }
