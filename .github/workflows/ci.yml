name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ⛔ A WORKFLOW THAT FAILS TO PARSE REPORTS NOTHING AT ALL -- no red cross, no
  # jobs, and `gh pr checks` answers "no checks reported on the branch", which
  # reads exactly like a check that has not started yet. actionlint is the only
  # thing that catches it, so it is the first lane. (Same reasoning, and the
  # same incident, as go-fleettools/fleettools.)
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  test:
    name: build + vet + test
    strategy:
      fail-fast: false
      matrix:
        # The command builds paths and file:// URLs and walks up to the root
        # looking for a .git; macOS is where kit.py was run and where /var is
        # a symlink to /private/var.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # ⛔ SAY WHICH TOOLCHAIN RAN. A green check that does not record the
      # compiler behind it makes every figure measured under it unattributable.
      - run: go version
      - name: gofmt
        run: |
          drift=$(gofmt -l .)
          if [ -n "$drift" ]; then echo "::error::not gofmt-clean:"; echo "$drift"; exit 1; fi
      - name: build
        run: CGO_ENABLED=0 go build ./...
      - name: vet
        run: go vet ./...
      - name: test, 100% statement coverage
        run: |
          go test -race -timeout 5m -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out
          below=$(go tool cover -func=coverage.out | awk '$NF != "100.0%"')
          if [ -n "$below" ]; then echo "::error::coverage below 100% on:"; echo "$below"; exit 1; fi

      # ⛔ EIGHT ADVISORIES WERE REACHABLE FROM THIS MODULE and nothing asked.
      # Scanned by hand on 2026-10-18 against the go.mod of that morning
      # (`go 1.27.1`): GO-2026-6605 through stdlib.Get, 6613 through Read, 6611
      # and 6607 through Write, 6603 through Close, 6610 and 6617 through
      # AddConn, 6608 through ReadMIMEHeader -- reachable, not merely present.
      # This module fetches pages, so those are its own HTTP paths.
      #
      # ⛔ And the directive IS this lane's toolchain, because the setup step
      # reads `go-version-file: go.mod`. A floor below the fix was a lane
      # linking the vulnerable standard library, so 100% coverage was being
      # measured on it.
      #
      # ⛔ NO `set -o pipefail`, deliberately: govulncheck exits non-zero over
      # findings it has decided are not called, and zero over some it has,
      # which is the whole reason vulngate exists. An unread scan is caught by
      # the emptiness check and by vulngate, which believes a run only when it
      # carried a config AND an SBOM. -go holds the scan to the toolchain that
      # actually ran.
      - name: govulncheck, judged by vulngate
        run: |
          set -eu
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/go-fleettools/fleettools/cmd/vulngate@v0.46.0
          BIN="$(go env GOPATH)/bin"
          "$BIN/govulncheck" -format json ./... > /tmp/vuln.json || true
          test -s /tmp/vuln.json || { echo "::error::govulncheck wrote nothing at all"; exit 1; }
          "$BIN/vulngate" -go "$(go env GOVERSION)" /tmp/vuln.json

  # A real Hugo site importing the module from THIS checkout (example/go.mod
  # replaces it with ../), checked for what the partials must put in the page,
  # then judged by `landingkit verify` with real hugo and real Chrome:
  # against itself it must pass, and against a copy whose background is tinted
  # (go-fft's old defect) it must FAIL. An instrument that has only ever said
  # PASS has not shown that it can see anything.
  hugo:
    name: a site importing the module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Hugo resolves modules with the go command.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.169.0"
          extended: true
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - run: go version && hugo version && "${{ steps.chrome.outputs.chrome-path }}" --version
      - name: build the example
        working-directory: example
        run: hugo --destination "$RUNNER_TEMP/example"
      - name: the partials are in the page
        run: |
          page="$RUNNER_TEMP/example/index.html"
          for want in '<meta name="darkreader-lock">' 'class="fork-ribbon"' '--cyan:#0079A8' 'id="theme-toggle"' 'aria-label="Fork me on GitHub"'; do
            grep -qF -- "$want" "$page" || { echo "::error::$want is not in the built page"; exit 1; }
          done
          echo "every partial reached the page"
          page="$RUNNER_TEMP/example/carousel/index.html"
          for want in 'aria-roledescription="carousel"' 'window.landingkitCarousel=api' 'src="/carousel/2.svg"' 'data-fade="loading"' 'id="lk-carousel-start"'; do
            grep -qF -- "$want" "$page" || { echo "::error::$want is not in the carousel page"; exit 1; }
          done
          echo "the loading carousel reached its page"
          page="$RUNNER_TEMP/example/index.html"
          # A page Hugo does not build (a playground written by a Go program)
          # renders it with landingkit.LoadingCarousel: the page Hugo built
          # holds that output, and testdata's golden file, byte for byte.
          LANDINGKIT_HUGO_PAGE="$RUNNER_TEMP/example/carousel/index.html" go test -count=1 -v -run '^TestLoadingCarouselIsHugos$' .
          # the chips are TEXT nodes (v0.7.0), never CSS generated content
          for want in '<code class="mantra-chip">LICENSE=BSD-3-Clause</code>' '<code class="mantra-chip">CGO_ENABLED=0</code>'; do
            grep -qF -- "$want" "$page" || { echo "::error::the mantra chip $want is not text in the page"; exit 1; }
          done
          if grep -qF 'content:"LICENSE=' "$page"; then
            echo "::error::the strip is CSS generated content again"; exit 1
          fi
          echo "the mantra is on by default, as text"
      # Four chips: the code's two and two data licences on a second row of
      # chips, which a phone stacks.
      - name: four mantra chips reach a page built with four
        run: |
          printf '[params.mantra]\n  items = ["LICENSE=BSD-3-Clause", "CGO_ENABLED=0", "fonts: OFL-1.1, Bitstream-Vera", "graphics: CC-BY-4.0"]\n' > "$RUNNER_TEMP/mantra-four.toml"
          (cd example && hugo --config "hugo.toml,$RUNNER_TEMP/mantra-four.toml" --destination "$RUNNER_TEMP/mantra-four")
          page="$RUNNER_TEMP/mantra-four/index.html"
          for want in '<code class="mantra-chip">fonts: OFL-1.1, Bitstream-Vera</code>' '<code class="mantra-chip">graphics: CC-BY-4.0</code>' '.nav{padding-bottom:92px}'; do
            grep -qF -- "$want" "$page" || { echo "::error::$want is not in the page"; exit 1; }
          done
          printf '[params.mantra]\n  items = ["a", "b", "c", "d", "e"]\n' > "$RUNNER_TEMP/mantra-five.toml"
          if (cd example && hugo --config "hugo.toml,$RUNNER_TEMP/mantra-five.toml" --destination "$RUNNER_TEMP/mantra-five"); then
            echo "::error::five items built"; exit 1
          fi
          echo "four chips reach the page; five are refused"
      # A landing's own mention of the licence shows only without the strip:
      # mantra-on.html answers for both.
      - name: the landing's own licence line, only without the strip
        run: |
          if grep -qF 'lk-own-licence' "$RUNNER_TEMP/example/index.html"; then
            echo "::error::the strip is on and the page repeats the licence"; exit 1
          fi
          printf '[params.mantra]\n  show = false\n' > "$RUNNER_TEMP/mantra-off2.toml"
          (cd example && hugo --config "hugo.toml,$RUNNER_TEMP/mantra-off2.toml" --destination "$RUNNER_TEMP/mantra-off2")
          grep -qF 'lk-own-licence' "$RUNNER_TEMP/mantra-off2/index.html" \
            || { echo "::error::the strip is off and the page lost its own licence line"; exit 1; }
          echo "the licence is said once: by the strip, or by the page"
      # A landing that adopts hero-carousel.html and lists no cards must not
      # change by one byte: hero-plain writes the terminal in, hero-nocards
      # goes through the partial, and both build from one layout.
      - name: no cards, the hero is the terminal byte for byte
        run: |
          cmp "$RUNNER_TEMP/example/hero-plain/index.html" "$RUNNER_TEMP/example/hero-nocards/index.html"
          grep -qF 'aria-roledescription="carousel"' "$RUNNER_TEMP/example/hero-cards/index.html" \
            || { echo "::error::the page with cards has no carousel"; exit 1; }
          echo "hero-nocards is hero-plain, byte for byte; hero-cards is a carousel"
      # terminal = "verify" is the landing's hero-terminal-verify.html; a name
      # that is not a plain word (it selects a template) fails the build.
      - name: a named terminal card, and a bad name refused
        run: |
          grep -qF 'a second terminal card: hero-terminal-verify.html' "$RUNNER_TEMP/example/hero-cards/index.html" \
            || { echo "::error::the named terminal card is not on the page"; exit 1; }
          printf -- '---\ntitle: "Bad"\nlayout: hero\nhero:\n  cards:\n    - terminal: true\n    - terminal: "../verify"\n---\n' > example/content/hero-bad.md
          if (cd example && hugo --destination "$RUNNER_TEMP/hero-bad"); then
            echo "::error::a terminal named ../verify built"; exit 1
          fi
          rm example/content/hero-bad.md
          echo "a named terminal reaches its card; a path is refused"
      # And an organisation that turns the mantra off gets the page the kit
      # built before the mantra existed, byte for byte: the base branch's
      # example, built with its own kit, against this one with
      # [params.mantra] show = false. Only meaningful while the base has no
      # mantra (the pull request that introduced it); said, not hidden, after.
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - name: the mantra off, the page is the pre-mantra base's byte for byte
        if: github.event_name == 'pull_request'
        run: |
          # the mantra moved out of styles.html in v0.7.0 (mantra-on.html,
          # mantra-items.html): look for it in any partial
          if grep -rq 'mantra' base/layouts/partials/; then
            echo "the base already has the mantra: nothing pre-mantra to compare with"; exit 0
          fi
          (cd base/example && hugo --destination "$RUNNER_TEMP/base-example")
          printf '[params.mantra]\n  show = false\n' > "$RUNNER_TEMP/mantra-off.toml"
          (cd example && hugo --config "hugo.toml,$RUNNER_TEMP/mantra-off.toml" --destination "$RUNNER_TEMP/mantra-off")
          cmp "$RUNNER_TEMP/base-example/index.html" "$RUNNER_TEMP/mantra-off/index.html"
          echo "show = false builds the base's index.html exactly"
      # i18n (v0.8.0): a site with ONE language is the page it was, byte for
      # byte (the words moved into i18n/en.yaml, the selector and the hreflang
      # print nothing), and a site with several gets a selector, hreflang, a
      # lang that is the locale, and translated words. Only meaningful while
      # the base has no i18n (the pull request that introduced it); said, not
      # hidden, after.
      - name: one language, the page is the base's byte for byte
        if: github.event_name == 'pull_request'
        run: |
          if [ -d base/i18n ]; then
            echo "the base already has i18n: nothing pre-i18n to compare with"; exit 0
          fi
          (cd base/example && hugo --destination "$RUNNER_TEMP/base-example-i18n")
          diff -r "$RUNNER_TEMP/base-example-i18n" "$RUNNER_TEMP/example"
          echo "every page of example/ is the base's, byte for byte"
      - name: one language prints no selector and no hreflang
        run: |
          for f in "$RUNNER_TEMP"/example/index.html "$RUNNER_TEMP"/example/carousel/index.html; do
            for bad in 'data-lang-selector' 'hreflang' 'lang-btn' 'lang-menu'; do
              if grep -qF -- "$bad" "$f"; then echo "::error::$f has $bad on a one-language site"; exit 1; fi
            done
          done
          echo "no selector, no hreflang on a one-language site"
      - name: several languages get a selector, hreflang, lang and translated words
        run: |
          (cd example-i18n && hugo --panicOnWarning --destination "$RUNNER_TEMP/example-i18n")
          out="$RUNNER_TEMP/example-i18n"
          check() { grep -qF -- "$2" "$out/$1" || { echo "::error::$1 lacks $2"; exit 1; }; }
          check index.html '<html lang="en">'
          check zh/index.html '<html lang="zh-Hans">'
          check ja/index.html '<html lang="ja">'
          check zh/index.html '<link rel="alternate" hreflang="zh-Hans" href="https://example.invalid/zh/">'
          check index.html '<link rel="alternate" hreflang="x-default" href="https://example.invalid/">'
          check index.html 'data-lang-selector'
          # the selector lists each language by its own name, linking to the same page
          for name in 'English' 'Français' '简体中文' '日本語' '한국어'; do check index.html ">$name</a>"; done
          check about/index.html 'href="/fr/about/"'
          # a language without the page falls back to that language's home
          check about/index.html 'href="/zh/" lang="zh-Hans"'
          # the kit's words are the language's
          check zh/index.html '🖥️ 跟随系统'
          check fr/index.html 'Forkez-moi sur GitHub'
          check ko/index.html 'html:lang(ko) body.lm{font-family'
          echo "the multilingual example has what it must"
      - name: go mod tidy keeps the requirement
        working-directory: example
        run: |
          go mod tidy
          grep -q 'github.com/go-fleettools/landingkit' go.mod \
            || { echo "::error::tidy deleted the requirement: kit.go no longer anchors it"; exit 1; }
      # ⛔ Ubuntu 24.04 forbids unprivileged user namespaces through AppArmor,
      # and Chrome then aborts with "No usable sandbox!" (signal 6) before it
      # renders anything. The runner is lifted to allow them, rather than the
      # tool learning --no-sandbox: what verify runs on a laptop is what it
      # runs here.
      - name: let Chrome use its sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: go build -o "$RUNNER_TEMP/landingkit" ./cmd/landingkit
      # Live, on purpose: the example links to a github.com blob page, which
      # github.com answers with 503 when a program asks for it; `links` must
      # go through the raw host and pass.
      - name: every link of the example resolves
        run: |
          "$RUNNER_TEMP/landingkit" links "$RUNNER_TEMP/example" | tee "$RUNNER_TEMP/links.log"
          grep -q '(via https://raw.githubusercontent.com/go-fleettools/landingkit/' "$RUNNER_TEMP/links.log" \
            || { echo "::error::the blob link was not probed on the raw host"; exit 1; }
      # The example lists its buttons in the WRONG order in hugo.toml; the
      # kit's cta.html must put them right, and `check` must see that it did
      # (it counts the rows it read: one).
      - name: the hero's buttons are in the kit's order
        run: |
          "$RUNNER_TEMP/landingkit" check "$RUNNER_TEMP/example" | tee "$RUNNER_TEMP/check.log"
          grep -q '1 hero call-to-action row(s) in the kit' "$RUNNER_TEMP/check.log" \
            || { echo "::error::check did not read the example's hero row"; exit 1; }
      - name: verify against itself (must pass)
        run: |
          "$RUNNER_TEMP/landingkit" verify -chrome "${{ steps.chrome.outputs.chrome-path }}" \
            -out "$RUNNER_TEMP/self" example example | tee "$RUNNER_TEMP/self.log"
      # The multilingual site's sheet is the reference's: the language CSS is a
      # second <style> block, which verify does not read, so a landing that
      # turns languages on still passes verify against the reference.
      - name: verify the multilingual example against the reference (must pass)
        run: |
          "$RUNNER_TEMP/landingkit" verify -chrome "${{ steps.chrome.outputs.chrome-path }}" \
            -out "$RUNNER_TEMP/i18n-verify" example-i18n example | tee "$RUNNER_TEMP/i18n-verify.log"
      # The false FAIL v0.2.0 gave: a tall full-width band (go-embedded-ruby's
      # .strip, on --bg-soft) at the height where fixed points used to sample.
      # The site has it, the reference does not, the backgrounds are equal:
      # verify must PASS, and must have sampled fewer points than on a page
      # without the band, which shows the probe excluded it.
      - name: verify a copy with a tall band where the old points sampled (must pass)
        run: |
          cp -R example "$RUNNER_TEMP/banded"
          sed -i "s#=> ../#=> $GITHUB_WORKSPACE#" "$RUNNER_TEMP/banded/go.mod"
          sed -i 's#  <section style="height:2400px"></section>#  <section style="height:300px"></section>\n  <div class="strip" style="height:900px"><div class="wrap"><p class="lead-line">a tall full-width band</p></div></div>\n  <section style="height:1600px"></section>#' "$RUNNER_TEMP/banded/layouts/index.html"
          grep -q 'class="strip" style="height:900px"' "$RUNNER_TEMP/banded/layouts/index.html" \
            || { echo "::error::the band was not inserted"; exit 1; }
          "$RUNNER_TEMP/landingkit" verify -chrome "${{ steps.chrome.outputs.chrome-path }}" \
            -out "$RUNNER_TEMP/banded-out" "$RUNNER_TEMP/banded" example | tee "$RUNNER_TEMP/banded.log"
          self=$(sed -n 's/^PASS light: \([0-9]*\)\/.*/\1/p' "$RUNNER_TEMP/self.log")
          band=$(sed -n 's/^PASS light: \([0-9]*\)\/.*/\1/p' "$RUNNER_TEMP/banded.log")
          echo "background points: $self without the band, $band with it"
          if [ -z "$self" ] || [ -z "$band" ] || [ "$band" -ge "$self" ]; then
            echo "::error::the band did not reduce the sampled points ($band vs $self)"; exit 1
          fi
      - name: verify a tinted copy (must fail)
        run: |
          cp -R example "$RUNNER_TEMP/tinted"
          mkdir -p "$RUNNER_TEMP/tinted/layouts/partials"
          sed 's/--bg:#ffffff;/--bg:#f0fdf9;/' layouts/partials/styles.html > "$RUNNER_TEMP/tinted/layouts/partials/styles.html"
          sed -i "s#=> ../#=> $GITHUB_WORKSPACE#" "$RUNNER_TEMP/tinted/go.mod"
          set +e
          "$RUNNER_TEMP/landingkit" verify -chrome "${{ steps.chrome.outputs.chrome-path }}" \
            -out "$RUNNER_TEMP/tinted-out" "$RUNNER_TEMP/tinted" example | tee "$RUNNER_TEMP/tinted.log"
          code=${PIPESTATUS[0]}
          set -e
          [ "$code" = 1 ] || { echo "::error::verify exited $code on a tinted background"; exit 1; }
          grep -q '^FAIL light: \([0-9]*\)/\1 background pixels differ' "$RUNNER_TEMP/tinted.log" \
            || { echo "::error::the pixel check did not see the tint"; exit 1; }
          grep -q 'FAIL the <style> blocks differ' "$RUNNER_TEMP/tinted.log" \
            || { echo "::error::the text check did not see the tint"; exit 1; }
