{{- /*
i18n-style.html: the sheet of a MULTILINGUAL site: the language selector and a
font stack per CJK language. Called by styles.html after its own sheet, so it
is a SECOND <style> block: `landingkit verify` compares the first one with the
reference's, and the reference has one language. It prints nothing on a site
with one language.
*/ -}}
{{- if hugo.IsMultilingual -}}
<style>
.lang{position:relative;display:inline-block}
.lang-btn{display:inline-flex;align-items:center;gap:7px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;padding:9px 14px;border-radius:12px;border:1px solid var(--line);color:var(--ink);background:var(--surface-2);transition:.15s}
.lang-btn:hover{border-color:var(--ghost-border-hover)}
.lang-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;min-width:10rem;margin:0;padding:6px;list-style:none;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:0 12px 32px -12px rgba(15,17,21,.45)}
.lang-menu[hidden]{display:none}
.lang-menu a{display:block;padding:8px 12px;border-radius:8px;font-size:14px;font-weight:600;white-space:nowrap}
.lang-menu a:hover{background:var(--line)}
.lang-menu a[aria-current]{color:var(--accent)}
.lang-menu a[aria-current]::after{content:" ✓"}
.lang-btn:focus-visible,.lang-menu a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:880px){.lang{margin-left:auto}}
@media(max-width:600px){.lang-btn{padding:9px 10px}.lang-cur{display:none}}
html:lang(zh-Hans) body.lm{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif}
html:lang(ja) body.lm{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans CJK JP","Source Han Sans JP",Meiryo,"Segoe UI",Roboto,sans-serif}
html:lang(ko) body.lm{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR","Source Han Sans KR","Segoe UI",Roboto,sans-serif}
html:lang(zh-Hans) .wrap,html:lang(ja) .wrap,html:lang(ko) .wrap{overflow-wrap:break-word}
html:lang(ja) h1,html:lang(ja) h2,html:lang(zh-Hans) h1,html:lang(zh-Hans) h2{line-break:strict}
</style>
{{- end -}}
