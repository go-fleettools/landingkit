# The smallest MULTILINGUAL landing: English at the root, French, Simplified
# Chinese, Japanese and Korean under their codes. CI builds it and checks what
# the kit puts in each page: lang, hreflang, the selector, the CJK fonts. The
# page "about" exists in English and French only, so the selector's link from
# it, in Chinese, is the Chinese home.
baseURL = 'https://example.invalid/'
title   = 'landingkit i18n example'
disableKinds = ['taxonomy', 'term', 'rss', 'sitemap', '404']
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false

[languages]
  [languages.en]
    label = 'English'
    weight = 1
  [languages.fr]
    label = 'Français'
    weight = 2
  [languages.zh]
    label = '简体中文'
    locale = 'zh-Hans'
    weight = 3
  [languages.ja]
    label = '日本語'
    weight = 4
  [languages.ko]
    label = '한국어'
    weight = 5

[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"
